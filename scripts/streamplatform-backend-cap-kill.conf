# Install:
#   sudo mkdir -p /etc/systemd/system/streamplatform-backend.service.d
#   sudo cp streamplatform-backend-cap-kill.conf /etc/systemd/system/streamplatform-backend.service.d/cap-kill.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart streamplatform-backend
#
# CAP_KILL lets the backend signal ffmpeg (www-data) when stream_ban force-ends a live publish.

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_KILL
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_KILL
