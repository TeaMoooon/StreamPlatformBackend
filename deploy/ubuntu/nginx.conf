user www-data;

worker_processes 1;
worker_rlimit_nofile 65535;

pid /run/nginx.pid;

error_log /var/log/nginx/error.log debug;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    server_tokens off;

    types_hash_max_size 2048;

    client_max_body_size 100M;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    #
    # LOGS
    #

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time '
        'ua="$upstream_addr" '
        'us="$upstream_status" '
        'ut="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/vnd.apple.mpegurl;

    #
    # HTTP -> HTTPS
    #

    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    #
    # HTTPS
    #

    server {
        listen 443 ssl http2;

        server_name _;

        ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        #
        # REACT
        #

        location / {
            root /var/www/SystemStream/build;

            try_files $uri $uri/ /index.html;

            index index.html;
        }

        #
        # API
        #

        location /api/ {
            proxy_pass http://127.0.0.1:5156/api/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";

            proxy_buffering off;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            access_log /var/log/nginx/api_access.log main;
        }

        #
        # SIGNALR
        #

        location /hubs/ {
            proxy_pass http://127.0.0.1:5156/hubs/;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;

            access_log /var/log/nginx/signalr_access.log main;
        }

        #
        # HLS
        #

        location /hls/ {
            alias /var/www/streamplatform/live/;

            #
            # SECURITY
            #

            if ($uri ~* "\.\./") {
                return 403;
            }

            #
            # FILES
            #

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";

            expires -1;

            sendfile off;

            tcp_nodelay on;

            #
            # LOG ONLY PLAYLISTS
            #

            location ~ \.m3u8$ {
                access_log /var/log/nginx/hls_access.log main;
            }

            location ~ \.ts$ {
                access_log off;
            }
        }

        #
        # MEDIA
        #

        location /media/ {
            alias /var/www/streamplatform/media/;

            expires 30d;

            access_log /var/log/nginx/media_access.log main;
        }
    }
}

#
# RTMP
#

rtmp {

    server {

        listen 1935;
        chunk_size 4096;
        max_streams 128;

        access_log /var/log/nginx/rtmp_access.log;

        ping 30s;
        ping_timeout 10s;

        notify_method post;
        
        application live {
            live on;
            record off;

            wait_key on;
            wait_video on;

            allow publish all;
            allow play all;

            on_publish http://127.0.0.1:5156/api/streamcallback/start?secret=your-secret-value;
            on_publish_done http://127.0.0.1:5156/api/streamcallback/end?secret=your-secret-value;

            
            exec_push /usr/local/bin/hls_transcoder.sh $name;
}
    }
}