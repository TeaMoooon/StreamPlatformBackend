# Справка: SRS ingest. secret в http_hooks = Rtmp:Secret в appsettings.

listen              1935;
max_connections     1000;

http_api {
    enabled on;
    listen  1985;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled      on;
        on_publish   http://127.0.0.1:5156/api/streamcallback/start?secret=your-secret-value;
        on_unpublish http://127.0.0.1:5156/api/streamcallback/end?secret=your-secret-value;
    }
}
