# Справка: SRS ingest.
# Колбэки идут на localhost nginx proxy (порт 5155), который добавляет
# заголовок X-Rtmp-Secret (= Rtmp:Secret в appsettings). Secret не в query string.

listen              1935;
max_connections     1000;

http_api {
    enabled on;
    listen  1985;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled      on;
        on_publish   http://127.0.0.1:5155/rtmp/on_publish;
        on_unpublish http://127.0.0.1:5155/rtmp/on_publish_done;
    }
}
